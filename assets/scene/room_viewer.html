<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Room Rig Model Scene</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #6FA8D6; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { display: none; }
    #err {
      position: absolute; inset: 12px; z-index: 3; display: none;
      color: #FF4D4D; font: 600 13px Outfit, system-ui, sans-serif;
      background: rgba(17,20,28,0.9); padding: 14px; border-radius: 12px;
      border: 1px solid rgba(255,77,77,0.4); white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" aria-hidden="true"></div>
  <div id="err"></div>
  <div id="minimap" style="display:none;position:absolute;right:10px;bottom:10px;z-index:2;width:108px;height:86px;border-radius:10px;border:1px solid #2C3348;background:rgba(17,20,28,0.82);overflow:hidden;pointer-events:none;">
    <canvas id="mm" width="108" height="86"></canvas>
  </div>
  <canvas id="loupe" width="216" height="216" style="display:none;position:absolute;z-index:4;width:108px;height:108px;border-radius:50%;border:2px solid #00E5FF;box-shadow:0 4px 16px rgba(0,0,0,0.45);pointer-events:none;background:#11141C;"></canvas>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script>
(function () {
  const canvas = document.getElementById('c');
  const errEl = document.getElementById('err');
  const hud = document.getElementById('hud');
  function setHud(_text) { /* orbit/move chrome removed — kept no-op for callers */ }

  function showError(msg) {
    errEl.style.display = 'block';
    errEl.textContent = msg;
    console.error(msg);
  }

  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: false, preserveDrawingBuffer: true,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x87B8E0, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x9EC4E6, 18, 55);
  scene.background = new THREE.Color(0x87B8E0);

  const camera = new THREE.PerspectiveCamera(48, 1, 0.05, 120);
  let yaw = 0.65, pitch = 0.28, distance = 3.4;
  let lookAt = new THREE.Vector3(2.1, 0.9, 1.8);
  let roomW = 4.2, roomD = 3.6, roomH = 2.7;
  let pendingOpenings = [];
  let exploreMode = 'orbit';
  let showMiniMap = false;
  let lastItems = [];
  let lastLampGlow = 0.7;
  let hasUserFramed = false;
  // Default works for staged temp dirs (Android) and web. Flutter may override.
  let assetBase = '../gltf/';

  function resolveAsset(url) {
    if (!url) return url;
    if (/^(https?:|file:|blob:|\/)/i.test(url)) return url;
    if (url.indexOf('../gltf/') === 0) return assetBase + url.slice('../gltf/'.length);
    if (url.indexOf('gltf/') === 0) return assetBase + url.slice('gltf/'.length);
    // Flutter web sometimes passes bare `kenney/desk.glb`.
    if (url.indexOf('kenney/') === 0 || url.indexOf('hvac/') === 0) {
      return assetBase + url;
    }
    return url;
  }
  const mmCanvas = document.getElementById('mm');
  const mmCtx = mmCanvas ? mmCanvas.getContext('2d') : null;
  const miniMapEl = document.getElementById('minimap');

  const loader = new THREE.GLTFLoader();
  const gltfCache = new Map();
  const furnitureRoot = new THREE.Group();
  scene.add(furnitureRoot);
  const liveFieldRoot = new THREE.Group();
  scene.add(liveFieldRoot);
  const roomRoot = new THREE.Group();
  scene.add(roomRoot);
  const exteriorRoot = new THREE.Group();
  scene.add(exteriorRoot);

  const hemi = new THREE.HemisphereLight(0xddeeff, 0x5a6a3a, 0.45);
  scene.add(hemi);
  // Outdoor sun is fill only — indoor shadows come from room bulbs, not exterior.
  const sun = new THREE.DirectionalLight(0xfff1c8, 0.35);
  sun.position.set(8, 14, -6);
  sun.castShadow = false;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x88c0ff, 0.18);
  fill.position.set(-6, 4, 4);
  scene.add(fill);
  // Primary indoor shadow caster — always at ceiling height (not desk lamps).
  const ceilingGlow = new THREE.PointLight(0xfff5e6, 1.35, 16, 1.35);
  ceilingGlow.castShadow = true;
  ceilingGlow.shadow.mapSize.set(1024, 1024);
  ceilingGlow.shadow.bias = -0.0008;
  ceilingGlow.shadow.normalBias = 0.03;
  scene.add(ceilingGlow);
  const interiorLightRoot = new THREE.Group();
  scene.add(interiorLightRoot);

  /** Local glow only — desk / floor lamps must not steal the shadow map. */
  const LOCAL_LAMPS = {
    lamp: { intensity: 0.85, distance: 3.2, heightFrac: 0.9, color: 0xffe6b8 },
    floorlamp: { intensity: 1.0, distance: 4.5, heightFrac: 0.93, color: 0xfff0d0 },
  };

  function clearInteriorLights() {
    while (interiorLightRoot.children.length) {
      const c = interiorLightRoot.children[0];
      if (c.target && c.target.parent) c.target.parent.remove(c.target);
      interiorLightRoot.remove(c);
    }
  }

  function ceilingLightY() {
    return Math.max(1.4, roomH - 0.1);
  }

  function configureCeilingShadow(light) {
    const reach = Math.max(roomH + 0.6, Math.max(roomW, roomD) * 1.15);
    light.distance = reach;
    light.castShadow = true;
    light.shadow.mapSize.set(1024, 1024);
    light.shadow.bias = -0.0008;
    light.shadow.normalBias = 0.03;
    light.shadow.camera.near = 0.12;
    light.shadow.camera.far = reach;
  }

  /**
   * Shadows always originate near the ceiling. Desk/floor lamps only add glow.
   * Placed ceiling fixtures move the shadow origin to their XY at ceiling Y.
   */
  function syncInteriorLights(items, lampGlow) {
    clearInteriorLights();
    const list = items || [];
    const glowLevel = (lampGlow == null || !isFinite(lampGlow)) ? 0.7 : lampGlow;
    const ceilY = ceilingLightY();
    const ceilingFixtures = [];
    const localLamps = [];
    for (const it of list) {
      const kind = (it.kind || '').toLowerCase();
      const mount = (it.mount || '').toLowerCase();
      if (kind === 'ceilinglight' || mount === 'ceiling') {
        ceilingFixtures.push(it);
      } else if (LOCAL_LAMPS[kind]) {
        localLamps.push({ it, kind });
      }
    }

    let shadowSources = 0;
    if (ceilingFixtures.length) {
      ceilingGlow.visible = false;
      ceilingGlow.castShadow = false;
      ceilingGlow.intensity = 0;
      for (const it of ceilingFixtures.slice(0, 2)) {
        const wrap = furnitureRoot.children.find((c) => c.userData.itemId === it.id);
        let x = +it.x || roomW * 0.5;
        let z = +it.z || roomD * 0.5;
        if (wrap) {
          wrap.updateWorldMatrix(true, true);
          const box = new THREE.Box3().setFromObject(wrap);
          if (!box.isEmpty()) {
            x = (box.min.x + box.max.x) * 0.5;
            z = (box.min.z + box.max.z) * 0.5;
          }
        }
        // Downward spot from true ceiling height — matches fixture elevation.
        const spot = new THREE.SpotLight(0xfff5e6, 1.9, 0, Math.PI / 2.15, 0.45, 1.15);
        spot.position.set(x, ceilY, z);
        spot.target.position.set(x, 0.02, z);
        configureCeilingShadow(spot);
        spot.distance = Math.max(roomH + 0.8, Math.max(roomW, roomD) * 1.1);
        spot.shadow.camera.far = spot.distance;
        interiorLightRoot.add(spot);
        interiorLightRoot.add(spot.target);
        shadowSources++;
      }
    } else {
      // No ceiling fixture — room fill still sits on the ceiling plane.
      ceilingGlow.position.set(roomW * 0.5, ceilY, roomD * 0.5);
      ceilingGlow.visible = true;
      ceilingGlow.intensity = 1.35;
      configureCeilingShadow(ceilingGlow);
      shadowSources = 1;
    }

    // Task / floor lamps: local warm glow + emissive mesh (live “on” state).
    for (const { it, kind } of localLamps.slice(0, 4)) {
      const cfg = LOCAL_LAMPS[kind];
      const wrap = furnitureRoot.children.find((c) => c.userData.itemId === it.id);
      let x = +it.x || 0;
      let y = (+it.y || 0) + (+it.h || 0.4) * cfg.heightFrac;
      let z = +it.z || 0;
      if (wrap) {
        wrap.updateWorldMatrix(true, true);
        const box = new THREE.Box3().setFromObject(wrap);
        if (!box.isEmpty()) {
          x = (box.min.x + box.max.x) * 0.5;
          z = (box.min.z + box.max.z) * 0.5;
          y = box.min.y + (box.max.y - box.min.y) * cfg.heightFrac;
        }
        wrap.traverse((o) => {
          if (!o.isMesh || !o.material) return;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach((m) => {
            if (!m || !m.emissive) return;
            if (!m.userData.lampLit) {
              m.userData.lampLit = true;
              m.emissive.setHex(cfg.color);
            }
            const glow = Math.min(1.25, 0.4 + glowLevel * 0.85);
            m.emissiveIntensity = 0.65 * glow;
          });
        });
      }
      const glowMul = Math.min(1.35, 0.55 + glowLevel * 0.9);
      const pl = new THREE.PointLight(cfg.color, cfg.intensity * 1.15 * glowMul, cfg.distance, 2);
      pl.castShadow = false;
      pl.position.set(x, y, z);
      interiorLightRoot.add(pl);
    }

    // Stand fans / AC niches: soft cyan wash so airflow gear reads “active”.
    for (const it of list) {
      const kind = (it.kind || '').toLowerCase();
      if (kind !== 'fan' && kind !== 'ac' && kind !== 'wallac' && kind !== 'portableac') continue;
      const wrap = furnitureRoot.children.find((c) => c.userData.itemId === it.id);
      let x = +it.x || roomW * 0.5;
      let y = (+it.y || 0) + 0.6;
      let z = +it.z || roomD * 0.5;
      if (wrap) {
        wrap.updateWorldMatrix(true, true);
        const box = new THREE.Box3().setFromObject(wrap);
        if (!box.isEmpty()) {
          x = (box.min.x + box.max.x) * 0.5;
          y = (box.min.y + box.max.y) * 0.55;
          z = (box.min.z + box.max.z) * 0.5;
        }
      }
      const base = kind === 'fan' ? 0.55 : 0.35;
      const breeze = new THREE.PointLight(0x66e8ff, base, 2.8, 2);
      breeze.castShadow = false;
      breeze.position.set(x, y, z);
      breeze.userData.airPulse = true;
      breeze.userData.basePulse = base;
      interiorLightRoot.add(breeze);
    }

    sun.intensity = shadowSources ? 0.2 : 0.35;
    sun.castShadow = false;
  }

  const texLoader = new THREE.TextureLoader();
  let floorMap = null;
  let wallMap = null;

  function loadTex(url, repeatX, repeatY) {
    return new Promise((resolve) => {
      texLoader.load(url, (t) => {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatX, repeatY);
        t.encoding = THREE.sRGBEncoding;
        resolve(t);
      }, undefined, () => resolve(null));
    });
  }

  function boxMat(color, rough, metal, map) {
    return new THREE.MeshStandardMaterial({
      color: color, roughness: rough, metalness: metal, map: map || null,
    });
  }

  function clearGroup(g) {
    while (g.children.length) {
      const c = g.children[0];
      g.remove(c);
      if (c.geometry) c.geometry.dispose();
    }
  }

  function rebuildExterior(w, d) {
    clearGroup(exteriorRoot);
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(Math.max(w, d) * 2.8, 64),
      new THREE.MeshStandardMaterial({ color: 0x4f7a45, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(w / 2, -0.02, d / 2);
    ground.receiveShadow = true;
    exteriorRoot.add(ground);

    // Simple sky dome tint (inside-out sphere)
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(40, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0x87B8E0, side: THREE.BackSide })
    );
    sky.position.set(w / 2, 0, d / 2);
    exteriorRoot.add(sky);
    // No patio slab — it used to overlap ~5 cm past the south wall into the floor.
  }

  /** Tag shell meshes so camera-facing walls can fade (House Control cutaway). */
  function markCutaway(mesh, outNx, outNz) {
    mesh.userData.cutaway = true;
    mesh.userData.outNx = outNx;
    mesh.userData.outNz = outNz;
    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    mats.forEach((mat) => {
      if (!mat) return;
      mat.transparent = true;
      if (mat.userData.baseOpacity == null) {
        mat.userData.baseOpacity = mat.opacity != null ? mat.opacity : 1;
      }
    });
  }

  /** Fade exterior walls whose outward normal faces the camera. */
  function updateWallCutaway() {
    const cx = roomW * 0.5;
    const cz = roomD * 0.5;
    let dx = camera.position.x - cx;
    let dz = camera.position.z - cz;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len;
    dz /= len;
    roomRoot.traverse((obj) => {
      if (!obj.isMesh || !obj.userData.cutaway) return;
      const facing = obj.userData.outNx * dx + obj.userData.outNz * dz > 0.22;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach((mat) => {
        if (!mat) return;
        const base = mat.userData.baseOpacity != null ? mat.userData.baseOpacity : 1;
        mat.opacity = facing ? Math.min(0.07, base * 0.12) : base;
        mat.depthWrite = !facing;
      });
      obj.castShadow = !facing;
    });
  }

  /** Build a wall along +X or +Z with rectangular openings cut as gaps. */
  function buildWallWithOpenings({
    alongX, // true => wall runs on X at fixed Z
    length, fixed, height, thick, openings, inwardSign, wallMat, glassMat,
    outNx, outNz,
  }) {
    // openings: [{ along0, along1, y0, y1, glass, through }]
    // through=true (door/window): cut shell + glass/daylight.
    // through=false niche (AC/vents): cut shell + opaque grille fill (no exterior).
    const segs = [{ a0: 0, a1: length }];
    const sorted = (openings || []).slice().sort((a, b) => a.along0 - b.along0);
    sorted.forEach((op) => {
      const next = [];
      segs.forEach((s) => {
        const o0 = Math.max(s.a0, op.along0);
        const o1 = Math.min(s.a1, op.along1);
        if (o1 <= o0 + 0.015) { next.push(s); return; }
        if (o0 > s.a0 + 0.015) next.push({ a0: s.a0, a1: o0 });
        if (o1 < s.a1 - 0.015) next.push({ a0: o1, a1: s.a1 });
      });
      segs.length = 0;
      segs.push.apply(segs, next);
    });

    segs.forEach((s) => {
      const len = s.a1 - s.a0;
      if (len < 0.03) return;
      const m = new THREE.Mesh(new THREE.BoxGeometry(
        alongX ? len : thick,
        height,
        alongX ? thick : len
      ), wallMat.clone());
      if (alongX) {
        m.position.set((s.a0 + s.a1) / 2, height / 2, fixed);
      } else {
        m.position.set(fixed, height / 2, (s.a0 + s.a1) / 2);
      }
      m.castShadow = true;
      m.receiveShadow = true;
      markCutaway(m, outNx, outNz);
      roomRoot.add(m);
    });

    const nicheMat = new THREE.MeshStandardMaterial({
      color: 0x3a3f46, roughness: 0.55, metalness: 0.25, side: THREE.DoubleSide,
    });

    // Fill above/below openings + glass (through) or opaque niche grille
    sorted.forEach((op) => {
      const len = op.along1 - op.along0;
      if (len < 0.04) return;
      // Sill / header
      if (op.y0 > 0.04) {
        const sill = new THREE.Mesh(
          new THREE.BoxGeometry(alongX ? len : thick, op.y0, alongX ? thick : len),
          wallMat.clone()
        );
        if (alongX) sill.position.set((op.along0 + op.along1) / 2, op.y0 / 2, fixed);
        else sill.position.set(fixed, op.y0 / 2, (op.along0 + op.along1) / 2);
        sill.castShadow = true;
        sill.receiveShadow = true;
        markCutaway(sill, outNx, outNz);
        roomRoot.add(sill);
      }
      if (op.y1 < height - 0.04) {
        const hh = height - op.y1;
        const head = new THREE.Mesh(
          new THREE.BoxGeometry(alongX ? len : thick, hh, alongX ? thick : len),
          wallMat.clone()
        );
        if (alongX) head.position.set((op.along0 + op.along1) / 2, op.y1 + hh / 2, fixed);
        else head.position.set(fixed, op.y1 + hh / 2, (op.along0 + op.along1) / 2);
        head.castShadow = true;
        head.receiveShadow = true;
        markCutaway(head, outNx, outNz);
        roomRoot.add(head);
      }
      const oh = Math.max(0.08, op.y1 - op.y0);
      const isThrough = op.through === true || op.kind === 'through';
      const isNiche = op.through === false || op.kind === 'niche';
      if (isThrough && op.glass) {
        const glass = new THREE.Mesh(
          new THREE.PlaneGeometry(alongX ? len * 0.96 : oh, alongX ? oh : len * 0.96),
          glassMat
        );
        if (alongX) {
          glass.position.set((op.along0 + op.along1) / 2, (op.y0 + op.y1) / 2, fixed + inwardSign * 0.01);
        } else {
          glass.rotation.y = Math.PI / 2;
          glass.position.set(fixed + inwardSign * 0.01, (op.y0 + op.y1) / 2, (op.along0 + op.along1) / 2);
        }
        roomRoot.add(glass);

        // Daylight wash through glass — no castShadow (indoor bulbs own shadows).
        const sunIn = new THREE.SpotLight(0xfff2cc, 0.35, 10, Math.PI / 4.5, 0.45, 1);
        sunIn.castShadow = false;
        if (alongX) {
          sunIn.position.set((op.along0 + op.along1) / 2, (op.y0 + op.y1) / 2, fixed - inwardSign * 1.2);
          sunIn.target.position.set((op.along0 + op.along1) / 2, 0.9, fixed + inwardSign * 1.5);
        } else {
          sunIn.position.set(fixed - inwardSign * 1.2, (op.y0 + op.y1) / 2, (op.along0 + op.along1) / 2);
          sunIn.target.position.set(fixed + inwardSign * 1.5, 0.9, (op.along0 + op.along1) / 2);
        }
        roomRoot.add(sunIn);
        roomRoot.add(sunIn.target);
      } else if (isNiche) {
        // Opaque plug = full wall thickness so a side view does not show a
        // thin grey wafer floating in a sky gap between sill and header.
        const niche = new THREE.Mesh(
          new THREE.BoxGeometry(
            alongX ? len * 0.98 : thick * 0.98,
            oh * 0.98,
            alongX ? thick * 0.98 : len * 0.98
          ),
          nicheMat
        );
        if (alongX) {
          niche.position.set(
            (op.along0 + op.along1) / 2,
            (op.y0 + op.y1) / 2,
            fixed
          );
        } else {
          niche.position.set(
            fixed,
            (op.y0 + op.y1) / 2,
            (op.along0 + op.along1) / 2
          );
        }
        niche.castShadow = true;
        niche.receiveShadow = true;
        roomRoot.add(niche);
        // Simple louver stripes on the room-facing face of the plug.
        const stripeN = Math.max(2, Math.min(6, Math.floor(oh / 0.06)));
        const face = fixed + inwardSign * thick * 0.48;
        for (let i = 0; i < stripeN; i++) {
          const t = (i + 0.5) / stripeN;
          const sy = op.y0 + oh * t;
          const bar = new THREE.Mesh(
            new THREE.BoxGeometry(
              alongX ? len * 0.9 : 0.012,
              0.012,
              alongX ? 0.012 : len * 0.9
            ),
            new THREE.MeshStandardMaterial({ color: 0x6a7078, roughness: 0.4, metalness: 0.45 })
          );
          if (alongX) {
            bar.position.set((op.along0 + op.along1) / 2, sy, face);
          } else {
            bar.position.set(face, sy, (op.along0 + op.along1) / 2);
          }
          roomRoot.add(bar);
        }
      }
    });
  }

  function rebuildRoom(w, d, h, openings) {
    roomW = w; roomD = d; roomH = h;
    pendingOpenings = openings || [];
    clearGroup(roomRoot);
    rebuildExterior(w, d);
    lookAt.set(w * 0.5, h * 0.32, d * 0.5);
    ceilingGlow.position.set(w * 0.5, Math.max(1.4, h - 0.1), d * 0.5);
    configureCeilingShadow(ceilingGlow);
    sun.position.set(w * 0.5 + 6, h + 10, d * 0.5 - 8);
    sun.castShadow = false;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(w, d),
      boxMat(0xc4a574, 0.78, 0.05, floorMap)
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(w / 2, 0, d / 2);
    floor.receiveShadow = true;
    roomRoot.add(floor);

    const wallMat = boxMat(0xe8e4dc, 0.92, 0.0, wallMap);
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xb8d8f0,
      transparent: true,
      opacity: 0.28,
      roughness: 0.05,
      metalness: 0,
      transmission: 0.85,
      thickness: 0.04,
      side: THREE.DoubleSide,
    });
    // Fallback if Physical unsupported
    if (!glassMat.transmission && glassMat.transmission !== 0) {
      /* keep */
    }

    const thick = 0.1;
    const byWall = { north: [], south: [], west: [], east: [] };
    pendingOpenings.forEach((op) => {
      const wall = op.wall || 'south';
      if (!byWall[wall]) return;
      byWall[wall].push({
        along0: +op.along0 || 0,
        along1: +op.along1 || 0.9,
        y0: +op.y0 || 0,
        y1: +op.y1 || 2.1,
        glass: !!op.glass,
        through: op.through === true || op.kind === 'through',
        kind: op.kind || (op.glass ? 'through' : (op.through === false ? 'niche' : 'through')),
      });
    });

    // Place wall *centers* outside the floor so only the interior face sits on
    // the room edge. Centering on 0/w/d buried half the thickness in the room
    // and made flush shelves / beds clip into the plaster.
    // north z=0 inward +Z; south z=d inward -Z; west x=0 inward +X; east x=w inward -X
    const halfT = thick * 0.5;
    // Outward normals: north −Z, south +Z, west −X, east +X.
    buildWallWithOpenings({
      alongX: true, length: w, fixed: -halfT, height: h, thick,
      openings: byWall.north, inwardSign: 1, wallMat, glassMat,
      outNx: 0, outNz: -1,
    });
    buildWallWithOpenings({
      alongX: true, length: w, fixed: d + halfT, height: h, thick,
      openings: byWall.south, inwardSign: -1, wallMat, glassMat,
      outNx: 0, outNz: 1,
    });
    buildWallWithOpenings({
      alongX: false, length: d, fixed: -halfT, height: h, thick,
      openings: byWall.west, inwardSign: 1, wallMat, glassMat,
      outNx: -1, outNz: 0,
    });
    buildWallWithOpenings({
      alongX: false, length: d, fixed: w + halfT, height: h, thick,
      openings: byWall.east, inwardSign: -1, wallMat, glassMat,
      outNx: 1, outNz: 0,
    });

    const ceil = new THREE.Mesh(
      new THREE.PlaneGeometry(w, d),
      boxMat(0xf2f0ea, 0.95, 0.0)
    );
    ceil.rotation.x = Math.PI / 2;
    ceil.position.set(w / 2, h, d / 2);
    ceil.receiveShadow = true;
    roomRoot.add(ceil);
  }

  function loadGltf(url) {
    url = resolveAsset(url);
    if (gltfCache.has(url)) return gltfCache.get(url);
    const p = new Promise((resolve, reject) => {
      loader.load(url, (g) => resolve(g.scene), undefined, reject);
    });
    gltfCache.set(url, p);
    return p;
  }

  /**
   * Rotate 90° only when the mesh long-axis disagrees with this item's
   * footprint — never a global "everything long on X" rule (that spun beds).
   */
  function alignToFootprint(root, targetW, targetD) {
    root.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    if (size.x < 1e-4 || size.z < 1e-4) return;
    const meshLongX = size.x >= size.z * 1.05;
    const meshLongZ = size.z >= size.x * 1.05;
    const footLongX = targetW >= targetD * 1.05;
    const footLongZ = targetD >= targetW * 1.05;
    if ((meshLongZ && footLongX) || (meshLongX && footLongZ)) {
      root.rotation.y += Math.PI / 2;
      root.updateMatrixWorld(true);
    }
  }

  function recenterOnFloor(root) {
    const box2 = new THREE.Box3().setFromObject(root);
    root.position.x -= (box2.min.x + box2.max.x) * 0.5;
    root.position.y -= box2.min.y;
    root.position.z -= (box2.min.z + box2.max.z) * 0.5;
  }

  /**
   * Seat a niche HVAC wrap so its room-facing AABB face is only [proud] metres
   * into the room. Uses world bounds vs the real wall plane — Sketchfab vents
   * often have depth on the wrong local axis, so local-Z seating still floated.
   */
  function seatNicheFlushToWall(wrap, wall, proudMeters) {
    const proud = proudMeters != null ? +proudMeters : 0.012;
    wrap.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(wrap);
    if (!isFinite(box.min.x) || box.isEmpty()) return;
    if (wall === 'north') {
      // Interior face z=0, room +Z → front is max.z
      wrap.position.z += proud - box.max.z;
    } else if (wall === 'south') {
      // Interior face z=roomD, room -Z → front is min.z
      wrap.position.z += (roomD - proud) - box.min.z;
    } else if (wall === 'west') {
      wrap.position.x += proud - box.max.x;
    } else if (wall === 'east') {
      wrap.position.x += (roomW - proud) - box.min.x;
    }
  }

  /**
   * mode from MeshProfile.fitMode:
   *   'uniform' | 'width' | 'height' | 'wallOpening'
   * Targets come from the Dart catalog (metres) — not per-kind hardcodes here.
   */
  function fitObject(root, targetW, targetD, targetH, mode) {
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    if (size.x < 1e-4 || size.y < 1e-4 || size.z < 1e-4) return;
    const sx = targetW / Math.max(size.x, 1e-4);
    const sy = targetH > 0 ? targetH / Math.max(size.y, 1e-4) : sx;
    const sz = targetD / Math.max(size.z, 1e-4);
    if (mode === 'wallOpening' || mode === 'ignoreDepth') {
      // Stay inside the clear opening; 0.99 leaves only a hairline vs the niche.
      root.scale.setScalar(Math.min(sx, sy) * 0.99);
    } else if (mode === 'width' || mode === 'fillWidth') {
      root.scale.setScalar(sx * 0.98);
    } else if (mode === 'height') {
      root.scale.setScalar(sy * 0.95);
    } else if (mode === 'fill') {
      // Legacy — avoid for furniture (stretches into slabs).
      root.scale.set(sx * 0.98, sy * 0.98, sz * 0.98);
    } else {
      root.scale.setScalar(Math.min(sx, sz, sy) * 0.92);
    }
    recenterOnFloor(root);
  }

  /** Apply MeshProfile fit fields from the scene payload. */
  function fitFurnitureModel(model, it, fitW, fitD, h) {
    const mode = (it.fit || 'uniform').toLowerCase();
    const tw = it.tw != null ? +it.tw : fitW;
    const td = it.td != null ? +it.td : fitD;
    const th = it.th != null ? +it.th : h;
    const biasDeg = +it.yawBias || 0;
    const mount = (it.mount || '').toLowerCase();
    // Wall openings always align long-axis to local +X (along-wall after wrap yaw).
    // Otherwise Kenney wallWindow/doorway stay long on Z and look stretched on E/W walls.
    if (it.alignFoot || mode === 'wallopening' || mount === 'wall') {
      alignToFootprint(model, Math.max(tw, 0.2), Math.max(td > 0 ? td : 0.14, 0.08));
    }
    if (biasDeg) model.rotation.y += THREE.MathUtils.degToRad(biasDeg);
    fitObject(model, tw, td, th, mode);
  }

  function enableShadows(obj, cast) {
    obj.traverse((c) => {
      if (c.isMesh) {
        c.castShadow = cast !== false;
        c.receiveShadow = true;
      }
    });
  }

  function placeholderMesh(kind, w, d, h) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(Math.max(w, 0.35) * 0.92, Math.max(h, 0.5) * 0.9, Math.max(d, 0.25) * 0.92),
      new THREE.MeshStandardMaterial({
        color: 0x00e5ff,
        roughness: 0.55,
        metalness: 0.05,
        emissive: 0x003844,
        emissiveIntensity: 0.35,
      })
    );
    body.position.y = Math.max(h, 0.5) * 0.45;
    body.castShadow = true;
    body.receiveShadow = true;
    g.add(body);
    return g;
  }

  /** Project a wall-mounted wrap's world AABB onto the wall opening axes. */
  function measureWallOpening(wrap, wall, pad) {
    wrap.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(wrap);
    if (!isFinite(box.min.x) || box.isEmpty()) return null;
    const p = pad || 0.02;
    let along0, along1;
    if (wall === 'north' || wall === 'south') {
      along0 = box.min.x - p;
      along1 = box.max.x + p;
    } else {
      along0 = box.min.z - p;
      along1 = box.max.z + p;
    }
    return {
      along0,
      along1,
      y0: Math.max(0, box.min.y - p * 0.5),
      y1: box.max.y + p * 0.5,
    };
  }

  function deskHostTopY(wrap) {
    wrap.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(wrap);
    if (!isFinite(box.max.y) || box.isEmpty()) return null;
    return box.max.y;
  }

  function xzOverlap(a, b) {
    return a.min.x < b.max.x && a.max.x > b.min.x &&
      a.min.z < b.max.z && a.max.z > b.min.z;
  }

  async function setFurniture(items) {
    while (furnitureRoot.children.length) furnitureRoot.remove(furnitureRoot.children[0]);
    const measuredCuts = [];
    const jobs = (items || []).map(async (it) => {
      const w = Math.max(0.2, +it.w || 0.8);
      const d = Math.max(0.2, +it.d || 0.8);
      const h = Math.max(0.2, +it.h || 0.9);
      const yawDeg = +it.yaw || 0;
      const mount = it.mount || 'floor';
      const kind = (it.kind || '').toLowerCase();
      // Match Orbit (FurnitureShapes): canonical mesh is long along X / faces +Z;
      // odd 90° yaws swap local W↔D so the world AABB stays on the grid cell.
      // Wall mounts must NOT swap — it.w is clear width along the wall, it.d is
      // thickness; swapping crushed doors/windows to ~wall-depth scale.
      const yawSteps = Math.round(yawDeg / 90);
      const swapAxes = mount !== 'wall' && Math.abs(yawSteps) % 2 === 1;
      const fitW = swapAxes ? d : w;
      const fitD = swapAxes ? w : d;
      const wrap = new THREE.Group();
      wrap.position.set(+it.x || 0, +it.y || 0, +it.z || 0);
      wrap.rotation.y = THREE.MathUtils.degToRad(yawDeg);
      wrap.userData.itemId = it.id;
      wrap.userData.mount = mount;
      wrap.userData.kind = kind;

      let model = null;
      if (it.model) {
        try {
          const src = await loadGltf(it.model);
          model = src.clone(true);
          enableShadows(model, !it.opening);
          fitFurnitureModel(model, it, fitW, fitD, h);
          // If fit collapsed the mesh, fall back so selection rings are not empty.
          model.updateWorldMatrix(true, true);
          const fitted = new THREE.Box3().setFromObject(model);
          const fs = new THREE.Vector3();
          fitted.getSize(fs);
          if (!isFinite(fs.x) || fs.x < 0.05 || fs.y < 0.05 || fs.z < 0.02) {
            console.warn('GLB fit too small, using placeholder', it.model, fs);
            model = null;
          }
        } catch (e) {
          console.warn('GLB failed', it.model, e);
          model = null;
        }
      }
      if (!model) model = placeholderMesh(it.kind || 'box', fitW, fitD, h);
      if (it.ghost) applyGhostMaterials(model, true);
      wrap.add(model);
      furnitureRoot.add(wrap);
      // After parenting: pull niche grilles flush to the plaster (world AABB).
      if (mount === 'wall' && it.wall && String(it.cutKind || '').toLowerCase() === 'niche') {
        const proud = it.wallProud != null ? +it.wallProud : 0.012;
        seatNicheFlushToWall(wrap, it.wall, proud);
      }

      if (it.selected) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(Math.max(w, d) * 0.55, Math.max(w, d) * 0.62, 48),
          new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.015;
        wrap.add(ring);
      }

      // After fit, size the shell hole from the real mesh bounds.
      if (mount === 'wall' && it.wall && (it.opening || it.cutKind)) {
        const m = measureWallOpening(wrap, it.wall, it.cutKind === 'niche' ? 0.015 : 0.02);
        if (m) {
          measuredCuts.push({
            wall: it.wall,
            along0: m.along0,
            along1: m.along1,
            y0: m.y0,
            y1: m.y1,
            glass: !!it.glass || it.kind === 'window' || it.kind === 'smartBlinds',
            through: it.cutKind !== 'niche',
            kind: it.cutKind || (it.opening ? 'through' : 'niche'),
          });
        }
      }
    });
    await Promise.all(jobs);

    // Seat desk-top items on the measured desk/table top (not a fixed 0.74
    // constant that drifts when mesh scale changes).
    const hosts = [];
    const deskItems = [];
    for (const wrap of furnitureRoot.children) {
      const k = wrap.userData.kind || '';
      if (wrap.userData.mount === 'desk') deskItems.push(wrap);
      if (k === 'desk' || k === 'table') hosts.push(wrap);
    }
    for (const item of deskItems) {
      item.updateWorldMatrix(true, true);
      const ib = new THREE.Box3().setFromObject(item);
      let bestY = null;
      for (const host of hosts) {
        host.updateWorldMatrix(true, true);
        const hb = new THREE.Box3().setFromObject(host);
        if (!xzOverlap(ib, hb)) continue;
        const top = deskHostTopY(host);
        if (top == null) continue;
        if (bestY == null || top > bestY) bestY = top;
      }
      if (bestY != null) item.position.y = bestY + 0.005;
    }

    syncInteriorLights(items, lastLampGlow);

    // Keep orbit/move hints in #hud — do not overwrite with debug item/GLB/shadow stats
    // (those stacked under Flutter chrome and hid useful copy).
    return measuredCuts;
  }

  // Pitch: negative = below lookAt looking up (ceiling); ~1.45 = top-down.
  const PITCH_MIN = -0.85;
  const PITCH_MAX = 1.42;
  const DIST_MIN = 0.85;
  const DIST_MAX = 18;

  function clampLookAt() {
    const m = 0.15;
    lookAt.x = Math.max(m, Math.min(roomW - m, lookAt.x));
    lookAt.z = Math.max(m, Math.min(roomD - m, lookAt.z));
    lookAt.y = Math.max(0.05, Math.min(roomH - 0.05, lookAt.y));
  }

  /** Place orbit rig so the camera sits at [cam] looking at [target] (interior). */
  function frameFrom(camX, camY, camZ, targetX, targetY, targetZ) {
    lookAt.set(targetX, targetY, targetZ);
    const dx = camX - targetX;
    const dy = camY - targetY;
    const dz = camZ - targetZ;
    let dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist < 1e-3) dist = 1;
    distance = Math.max(DIST_MIN, Math.min(DIST_MAX, dist));
    pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, Math.asin(dy / dist)));
    yaw = Math.atan2(dx, dz);
  }

  function updateCamera() {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    camera.position.set(
      lookAt.x + distance * cp * sy,
      lookAt.y + distance * sp,
      lookAt.z + distance * cp * cy
    );
    camera.lookAt(lookAt);
  }

  function findDoorItem() {
    return (lastItems || []).find((it) => {
      const k = (it.kind || it.id || '').toLowerCase();
      return k === 'door' || k.indexOf('door') >= 0;
    }) || null;
  }

  /**
   * All presets keep the camera inside the room envelope so Check shows
   * furniture / interior walls — not the exterior shell.
   */
  function applyPreset(name) {
    exploreMode = 'orbit';
    const cx = roomW * 0.5;
    const cz = roomD * 0.5;
    const inset = Math.min(0.55, Math.min(roomW, roomD) * 0.18);
    const eyeY = Math.min(1.55, Math.max(1.15, roomH * 0.52));
    const midY = Math.min(1.15, roomH * 0.42);

    if (name === 'birdseye') {
      // Just under the ceiling, looking straight down at the floor plan.
      frameFrom(cx, roomH - 0.22, cz, cx, 0.08, cz);
    } else if (name === 'cornerA') {
      // Inside near (−X,−Z), looking across the room.
      frameFrom(inset, eyeY, inset, cx, midY, cz);
    } else if (name === 'cornerB') {
      // Opposite interior corner.
      frameFrom(roomW - inset, eyeY, roomD - inset, cx, midY, cz);
    } else if (name === 'eyeLevel') {
      // Standing along the near wall, eye-height, facing the room center.
      frameFrom(cx, eyeY, inset, cx, eyeY * 0.85, roomD - inset * 1.2);
    } else if (name === 'door') {
      const door = findDoorItem();
      let camX = cx, camZ = inset, targetX = cx, targetZ = cz;
      if (door) {
        const wall = (door.wall || '').toLowerCase();
        const dx = +door.x || cx;
        const dz = +door.z || cz;
        if (wall === 'south' || (!wall && dz > roomD * 0.55)) {
          camX = dx; camZ = Math.min(roomD - inset, dz - 0.35);
          targetX = cx; targetZ = inset * 1.4;
        } else if (wall === 'north' || (!wall && dz < roomD * 0.45)) {
          camX = dx; camZ = Math.max(inset, dz + 0.35);
          targetX = cx; targetZ = roomD - inset * 1.4;
        } else if (wall === 'west' || (!wall && dx < roomW * 0.45)) {
          camX = Math.max(inset, dx + 0.35); camZ = dz;
          targetX = roomW - inset * 1.4; targetZ = cz;
        } else {
          camX = Math.min(roomW - inset, dx - 0.35); camZ = dz;
          targetX = inset * 1.4; targetZ = cz;
        }
      }
      frameFrom(camX, eyeY, camZ, targetX, midY, targetZ);
    } else if (name === 'ceiling') {
      // Low center, looking up at the ceiling plane.
      frameFrom(cx, 0.75, cz, cx, roomH - 0.08, cz);
    } else {
      frameFrom(inset * 1.4, eyeY, inset * 1.4, cx, midY, cz);
    }
    hasUserFramed = true;
    clampLookAt();
    updateCamera();
    setHud('');
  }

  function focusItem(id) {
    const it = lastItems.find((x) => x.id === id);
    if (!it) return;
    lookAt.set(+it.x || 0, (+it.y || 0) + (+it.h || 0.8) * 0.45, +it.z || 0);
    distance = Math.max(2.8, Math.min(10, Math.max(+it.w || 1, +it.d || 1) * 3.2 + 2.2));
    pitch = 0.42;
    exploreMode = 'orbit';
    clampLookAt();
    setHud('');
  }

  function setExploreMode(mode) {
    exploreMode = 'orbit';
    setHud('');
  }

  function setMiniMap(on) {
    showMiniMap = !!on;
    if (miniMapEl) miniMapEl.style.display = showMiniMap ? 'block' : 'none';
  }

  function drawMiniMap() {
    if (!showMiniMap || !mmCtx) return;
    const w = mmCanvas.width, h = mmCanvas.height;
    mmCtx.clearRect(0, 0, w, h);
    mmCtx.fillStyle = '#1B2030';
    mmCtx.fillRect(0, 0, w, h);
    const pad = 8;
    const sx = (w - pad * 2) / Math.max(roomW, 0.1);
    const sz = (h - pad * 2) / Math.max(roomD, 0.1);
    const s = Math.min(sx, sz);
    const ox = (w - roomW * s) * 0.5;
    const oz = (h - roomD * s) * 0.5;
    mmCtx.strokeStyle = '#2C3348';
    mmCtx.strokeRect(ox, oz, roomW * s, roomD * s);
    for (const it of lastItems) {
      const iw = Math.max(0.15, +it.w || 0.4) * s;
      const id = Math.max(0.15, +it.d || 0.4) * s;
      mmCtx.fillStyle = it.selected ? '#00E5FF' : '#5A6280';
      mmCtx.fillRect(ox + (+it.x - (+it.w || 0.4) * 0.5) * s, oz + (+it.z - (+it.d || 0.4) * 0.5) * s, iw, id);
    }
    const cam = camera.position;
    mmCtx.fillStyle = '#2EE68A';
    mmCtx.beginPath();
    mmCtx.arc(ox + cam.x * s, oz + cam.z * s, 3.5, 0, Math.PI * 2);
    mmCtx.fill();
  }

  function resize() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }

  // Desktop: LMB orbit, RMB/MMB pan, wheel zoom.
  // Touch: 1-finger orbit, 2-finger pan + pinch zoom.
  // Selected mesh (or Place ghost): LMB drag moves it; empty / other = orbit / tap.
  const activePtrs = new Map();
  let gesture = null; // 'orbit' | 'pan' | 'panzoom' | 'drag'
  let lastX = 0, lastY = 0;
  let lastMidX = 0, lastMidY = 0, lastPinch = 0;
  let moveMode = false;
  let dragId = null;
  let dragBlocked = false;
  let pointerDownItemId = null;
  let downX = 0, downY = 0;
  let loupeClientX = 0, loupeClientY = 0;
  const loupeEl = document.getElementById('loupe');
  const loupeCtx = loupeEl ? loupeEl.getContext('2d') : null;
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const _floorHit = new THREE.Vector3();

  function postToFlutter(obj) {
    const msg = JSON.stringify(obj);
    try {
      if (window.RoomRigChannel && RoomRigChannel.postMessage) {
        RoomRigChannel.postMessage(msg);
        return;
      }
    } catch (_) {}
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, '*');
      }
    } catch (_) {}
  }

  function pickItemId(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width, 1);
    const h = Math.max(rect.height, 1);
    ndc.x = ((clientX - rect.left) / w) * 2 - 1;
    ndc.y = -((clientY - rect.top) / h) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(furnitureRoot.children, true);
    for (let i = 0; i < hits.length; i++) {
      let o = hits[i].object;
      while (o && o !== furnitureRoot) {
        if (o.userData && o.userData.itemId) return o.userData.itemId;
        o = o.parent;
      }
    }
    return null;
  }

  function floorHitMeters(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width, 1);
    const h = Math.max(rect.height, 1);
    ndc.x = ((clientX - rect.left) / w) * 2 - 1;
    ndc.y = -((clientY - rect.top) / h) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    if (!raycaster.ray.intersectPlane(floorPlane, _floorHit)) return null;
    return { x: _floorHit.x, z: _floorHit.z };
  }

  function updateItemPose(id, x, y, z, yawDeg) {
    if (!id) return;
    for (let i = 0; i < furnitureRoot.children.length; i++) {
      const wrap = furnitureRoot.children[i];
      if (wrap.userData.itemId !== id) continue;
      if (x != null) wrap.position.x = +x;
      if (y != null) wrap.position.y = +y;
      if (z != null) wrap.position.z = +z;
      if (yawDeg != null) wrap.rotation.y = THREE.MathUtils.degToRad(+yawDeg);
      for (let j = 0; j < lastItems.length; j++) {
        if (lastItems[j].id === id) {
          if (x != null) lastItems[j].x = +x;
          if (y != null) lastItems[j].y = +y;
          if (z != null) lastItems[j].z = +z;
          if (yawDeg != null) lastItems[j].yaw = +yawDeg;
          break;
        }
      }
      return;
    }
  }

  function updateItemPoses(items) {
    (items || []).forEach((it) => updateItemPose(it.id, it.x, it.y, it.z, it.yaw));
  }

  window.updateItemPose = updateItemPose;
  window.updateItemPoses = updateItemPoses;
  window.setMoveMode = function (on) {
    moveMode = !!on;
    setHud('');
  };

  window.setDragFeedback = function (payload) {
    const data = typeof payload === 'string' ? JSON.parse(payload) : (payload || {});
    dragBlocked = !!data.blocked;
    if (loupeEl) {
      loupeEl.style.borderColor = dragBlocked ? '#FF4D4D' : '#00E5FF';
    }
  };

  function itemIsGhost(id) {
    if (!id) return false;
    for (let i = 0; i < lastItems.length; i++) {
      if (lastItems[i].id === id) return !!lastItems[i].ghost;
    }
    return false;
  }

  function applyGhostMaterials(root, ghost) {
    root.traverse((c) => {
      if (!c.isMesh || !c.material) return;
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      for (let i = 0; i < mats.length; i++) {
        const m = mats[i];
        if (!m) continue;
        if (ghost) {
          if (m.userData._preGhost == null) {
            m.userData._preGhost = {
              transparent: !!m.transparent,
              opacity: m.opacity != null ? m.opacity : 1,
              depthWrite: m.depthWrite !== false,
            };
          }
          m.transparent = true;
          m.opacity = Math.min(m.userData._preGhost.opacity, 0.42);
          m.depthWrite = false;
          m.needsUpdate = true;
        } else if (m.userData._preGhost) {
          m.transparent = m.userData._preGhost.transparent;
          m.opacity = m.userData._preGhost.opacity;
          m.depthWrite = m.userData._preGhost.depthWrite;
          m.needsUpdate = true;
          delete m.userData._preGhost;
        }
      }
    });
  }

  function updateLoupe(clientX, clientY) {
    if (!loupeEl || !loupeCtx || !dragId) {
      if (loupeEl) loupeEl.style.display = 'none';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const lx = clientX - rect.left;
    const ly = clientY - rect.top;
    const src = 72;
    const dx = Math.max(0, Math.min(canvas.width - src, lx * (canvas.width / Math.max(rect.width, 1)) - src * 0.5));
    const dy = Math.max(0, Math.min(canvas.height - src, ly * (canvas.height / Math.max(rect.height, 1)) - src * 0.5));
    loupeCtx.fillStyle = '#11141C';
    loupeCtx.fillRect(0, 0, 216, 216);
    try {
      loupeCtx.drawImage(canvas, dx, dy, src, src, 0, 0, 216, 216);
    } catch (_) {}
    loupeEl.style.display = 'block';
    loupeEl.style.borderColor = dragBlocked ? '#FF4D4D' : '#00E5FF';
    const left = Math.min(rect.width - 120, Math.max(8, lx - 54));
    const top = Math.max(8, ly - 170);
    loupeEl.style.left = left + 'px';
    loupeEl.style.top = top + 'px';
  }

  function hideLoupe() {
    if (loupeEl) loupeEl.style.display = 'none';
  }

  function ptrList() { return Array.from(activePtrs.values()); }

  function beginGesture() {
    const pts = ptrList();
    if (gesture === 'drag' && pts.length === 1) return;
    if (pts.length === 1) {
      const btn = pts[0].button;
      // 0 = left orbit; 1 = middle pan; 2 = right pan (touch button is 0).
      gesture = (btn === 2 || btn === 1) ? 'pan' : 'orbit';
      lastX = pts[0].x; lastY = pts[0].y;
    } else if (pts.length >= 2) {
      gesture = 'panzoom';
      lastMidX = (pts[0].x + pts[1].x) * 0.5;
      lastMidY = (pts[0].y + pts[1].y) * 0.5;
      lastPinch = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    } else {
      gesture = null;
    }
  }

  const _panRight = new THREE.Vector3();
  const _panUp = new THREE.Vector3();
  function panLookAt(dx, dy) {
    // Screen-space pan (like OrbitControls): vertical drag raises the pivot
    // so you can slide up toward the ceiling without leaving orbit mode.
    updateCamera();
    const h = canvas.clientHeight || 1;
    const panScale = distance * Math.tan((camera.fov * Math.PI / 180) * 0.5) * 2 / h;
    _panRight.setFromMatrixColumn(camera.matrixWorld, 0);
    _panUp.setFromMatrixColumn(camera.matrixWorld, 1);
    lookAt.addScaledVector(_panRight, -dx * panScale);
    lookAt.addScaledVector(_panUp, dy * panScale);
    clampLookAt();
  }

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    activePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button });
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    downX = e.clientX;
    downY = e.clientY;
    pointerDownItemId = (activePtrs.size === 1 && e.button === 0)
      ? pickItemId(e.clientX, e.clientY)
      : null;
    const hitSelected = pointerDownItemId && lastItems.some(
      (it) => it.id === pointerDownItemId && it.selected);
    const canDragHit = pointerDownItemId &&
      (itemIsGhost(pointerDownItemId) || (moveMode && hitSelected));
    if (canDragHit && activePtrs.size === 1 && e.button === 0) {
      gesture = 'drag';
      dragId = pointerDownItemId;
      loupeClientX = e.clientX;
      loupeClientY = e.clientY;
      postToFlutter({ type: 'dragStart', id: dragId });
      const floor = floorHitMeters(e.clientX, e.clientY);
      if (floor) postToFlutter({ type: 'drag', id: dragId, x: floor.x, z: floor.z });
      return;
    }
    beginGesture();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!activePtrs.has(e.pointerId)) return;
    const prev = activePtrs.get(e.pointerId);
    activePtrs.set(e.pointerId, { x: e.clientX, y: e.clientY, button: prev.button });
    const pts = ptrList();
    if (gesture === 'drag' && dragId && pts.length === 1) {
      loupeClientX = pts[0].x;
      loupeClientY = pts[0].y;
      const floor = floorHitMeters(pts[0].x, pts[0].y);
      if (floor) postToFlutter({ type: 'drag', id: dragId, x: floor.x, z: floor.z });
      return;
    }
    if (pts.length === 1 && gesture === 'orbit') {
      const dx = pts[0].x - lastX, dy = pts[0].y - lastY;
      lastX = pts[0].x; lastY = pts[0].y;
      yaw -= dx * 0.008;
      pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch + dy * 0.006));
    } else if (pts.length === 1 && gesture === 'pan') {
      const dx = pts[0].x - lastX, dy = pts[0].y - lastY;
      lastX = pts[0].x; lastY = pts[0].y;
      panLookAt(dx, dy);
    } else if (pts.length >= 2) {
      if (gesture === 'drag') {
        postToFlutter({ type: 'dragEnd', id: dragId });
        dragId = null;
      }
      if (gesture !== 'panzoom') beginGesture();
      const midX = (pts[0].x + pts[1].x) * 0.5;
      const midY = (pts[0].y + pts[1].y) * 0.5;
      const pinch = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
      const mdx = midX - lastMidX, mdy = midY - lastMidY;
      panLookAt(mdx, mdy);
      if (lastPinch > 0) {
        distance = Math.max(DIST_MIN, Math.min(DIST_MAX, distance * (lastPinch / pinch)));
      }
      lastMidX = midX; lastMidY = midY; lastPinch = pinch;
    }
  });
  function endPointer(e) {
    const wasDrag = gesture === 'drag' && dragId;
    const endedId = dragId;
    const tapDist = Math.hypot(e.clientX - downX, e.clientY - downY);
    const wasTap = !wasDrag && tapDist < 10 && e.button === 0;
    activePtrs.delete(e.pointerId);
    if (wasDrag) {
      postToFlutter({ type: 'dragEnd', id: endedId });
      dragId = null;
      dragBlocked = false;
      hideLoupe();
      gesture = null;
    } else if (wasTap && activePtrs.size === 0) {
      const hit = pickItemId(e.clientX, e.clientY);
      if (hit) postToFlutter({ type: 'select', id: hit });
      else postToFlutter({ type: 'deselect' });
    }
    pointerDownItemId = null;
    beginGesture();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerout', (e) => {
    if (e.pointerType === 'touch') endPointer(e);
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    distance = Math.max(DIST_MIN, Math.min(DIST_MAX, distance + e.deltaY * 0.01));
  }, { passive: false });

  async function applyScene(payload) {
    try {
      const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
      const w = +data.roomW || 4.2;
      const d = +data.roomD || 3.6;
      const h = +data.roomH || 2.7;
      const openings = data.openings || [];
      rebuildRoom(w, d, h, openings);
      // Preserve the live orbit unless Flutter explicitly asks to apply camera
      // (select / furniture drag / refresh must not snap the view).
      if (data.applyCamera) {
        if (data.yaw != null) yaw = +data.yaw;
        if (data.pitch != null) pitch = +data.pitch;
        if (data.distance != null) distance = +data.distance;
      }
      if (data.assetBase) assetBase = data.assetBase;
      lastItems = data.items || [];
      if (data.lampGlow != null && isFinite(+data.lampGlow)) lastLampGlow = +data.lampGlow;
      if (data.exploreMode) setExploreMode(data.exploreMode);
      if (data.preset) {
        applyPreset(data.preset);
      } else if (!hasUserFramed) {
        // First paint: interior corner, not the old exterior orbit.
        applyPreset('cornerA');
      }
      if (data.focusId) focusItem(data.focusId);
      if (data.miniMap != null) setMiniMap(!!data.miniMap);
      if (data.moveMode != null) window.setMoveMode(!!data.moveMode);
      // Furniture first — live field must never block GLB placement.
      const measured = await setFurniture(data.items || []);
      // Second pass: shrink/grow shell cuts to the fitted GLB bounds.
      if (measured && measured.length) {
        const clamped = measured.map((op) => {
          const maxAlong = (op.wall === 'north' || op.wall === 'south') ? w : d;
          return {
            ...op,
            along0: Math.max(0, Math.min(maxAlong, op.along0)),
            along1: Math.max(0, Math.min(maxAlong, op.along1)),
            y0: Math.max(0, Math.min(h, op.y0)),
            y1: Math.max(0.05, Math.min(h, op.y1)),
          };
        }).filter((op) => op.along1 - op.along0 > 0.08 && op.y1 - op.y0 > 0.08);
        if (clamped.length) rebuildRoom(w, d, h, clamped);
      }
      if (data.liveField) setLiveField(data.liveField);
      else setLiveField([]);
    } catch (e) {
      showError('Scene update failed: ' + e);
    }
  }

  function setLiveField(cells) {
    try {
      clearGroup(liveFieldRoot);
      const list = cells || [];
      for (let i = 0; i < list.length; i++) {
        const c = list[i];
        const x0 = +c.x0 || 0;
        const z0 = +c.z0 || 0;
        const x1 = +c.x1 || x0;
        const z1 = +c.z1 || z0;
        const w = Math.max(0.02, x1 - x0);
        const d = Math.max(0.02, z1 - z0);
        const r = c.r != null ? +c.r : 0.2;
        const g = c.g != null ? +c.g : 0.8;
        const b = c.b != null ? +c.b : 0.9;
        const a = c.a != null ? +c.a : 0.25;
        if (![r, g, b, a, w, d, x0, z0].every((v) => isFinite(v))) continue;
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(w, d),
          new THREE.MeshBasicMaterial({
            color: new THREE.Color(
              Math.max(0, Math.min(1, r)),
              Math.max(0, Math.min(1, g)),
              Math.max(0, Math.min(1, b)),
            ),
            transparent: true,
            opacity: Math.max(0.04, Math.min(0.7, a)),
            depthWrite: false,
            side: THREE.DoubleSide,
          })
        );
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set((x0 + x1) * 0.5, 0.025, (z0 + z1) * 0.5);
        mesh.renderOrder = 1;
        liveFieldRoot.add(mesh);
      }
    } catch (e) {
      console.warn('setLiveField failed', e);
    }
  }

  window.setRoomScene = applyScene;
  window.applyCameraPreset = applyPreset;
  window.setExploreMode = setExploreMode;
  window.focusItem = focusItem;
  window.setMiniMap = setMiniMap;
  window.setLiveField = setLiveField;
  window.addEventListener('message', (ev) => {
    if (!ev || ev.data == null) return;
    let data = ev.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (_) { return; }
    }
    if (!data || typeof data !== 'object') return;
    if (data.type === 'updatePoses') {
      updateItemPoses(data.items || []);
      return;
    }
    if (data.type === 'setMoveMode') {
      window.setMoveMode(!!data.moveMode);
      return;
    }
    if (data.type === 'setDragFeedback') {
      window.setDragFeedback(data);
      return;
    }
    if (data.type === 'setLiveField') {
      setLiveField(data.cells || []);
      return;
    }
    if (data.type === 'select' || data.type === 'deselect' ||
        data.type === 'drag' || data.type === 'dragStart' || data.type === 'dragEnd') {
      return;
    }
    applyScene(data);
  });

  Promise.all([
    loadTex(resolveAsset('../gltf/wood_floor_diff.jpg'), 3, 3),
    loadTex(resolveAsset('../gltf/plaster_wall_diff.jpg'), 2.2, 1.4),
  ]).then(([f, w]) => {
    floorMap = f;
    wallMap = w;
    rebuildRoom(roomW, roomD, roomH, []);
    try {
      if (window.RoomRigChannel && RoomRigChannel.postMessage) {
        RoomRigChannel.postMessage(JSON.stringify({ type: 'ready' }));
      }
    } catch (_) {}
  }).catch(() => rebuildRoom(roomW, roomD, roomH, []));

  function frame(now) {
    resize();
    updateCamera();
    updateWallCutaway();
    const t = (now || 0) * 0.001;
    for (const c of interiorLightRoot.children) {
      if (c.isLight && c.userData.airPulse) {
        const base = c.userData.basePulse != null ? c.userData.basePulse : 0.4;
        c.intensity = base * (0.82 + 0.18 * Math.sin(t * 3.2));
      }
    }
    drawMiniMap();
    renderer.render(scene, camera);
    if (dragId) updateLoupe(loupeClientX, loupeClientY);
    else hideLoupe();
    requestAnimationFrame(frame);
  }
  frame();
})();
  </script>
</body>
</html>
