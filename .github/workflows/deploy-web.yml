# Build Flutter web and deploy static output to Vercel.
# Secrets (repo Settings → Secrets → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy web

on:
  push:
    branches: [test, main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/build_web.sh

      # Deploy only the built site (not the whole monorepo — hits Vercel file limits).
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # build/web alone stays under Vercel file limits; CLI in this action
          # is too old for --archive.
          working-directory: build/web
          vercel-args: '--prod'
