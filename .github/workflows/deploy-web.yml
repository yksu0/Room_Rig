# Build marketing storefront and deploy static output to Vercel.
# Product experience is the Android APK; Vercel hosts description + auth + download.
# Secrets (repo Settings → Secrets → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# ORG/PROJECT IDs must match local .vercel/project.json (team_… / prj_…).
name: Deploy web

on:
  push:
    branches: [test, main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build storefront
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/build_site.sh

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          vercel deploy build/site --prod --yes --token="$VERCEL_TOKEN" --archive=tgz
