# Build Next.js storefront under site/ and deploy with Vercel CLI (--prebuilt).
# Preferred long-term: Vercel Git integration with Root Directory = site, then disable this workflow.
# Secrets (repo Settings → Secrets → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY  (mapped to NEXT_PUBLIC_*)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy web

on:
  push:
    branches: [test, main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Require public Supabase env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY secrets (mapped to NEXT_PUBLIC_*)."
            exit 1
          fi
          echo "Public Supabase env present (values not printed)."

      - name: Install & build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GITHUB_REPO: yksu0/Room_Rig
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Deploy to Vercel
        working-directory: site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GITHUB_REPO: yksu0/Room_Rig
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?SUPABASE_URL secret missing}"
          : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY secret missing}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID secret missing}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID secret missing}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret missing}"
          npm install -g vercel@latest
          # project.json must live under site/.vercel (same cwd as pull/build/deploy)
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
